<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>CloudFader Player</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body data-mode="player">
    <main class="shell playerShell">
      <header class="topbar">
        <div class="brandBlock">
          <p class="eyebrow">Player Node</p>
          <h1>CloudFader Player</h1>
        </div>
        <div class="topActions">
          <button class="devicePill" id="deviceToggle" type="button">
            <span class="dot"></span>
            <span id="deviceSummary">0/0 players</span>
          </button>
          <a class="modeLink" href="/">Control</a>
        </div>
      </header>

      <section class="stagePanel playerStage">
        <div class="stageMeta">
          <span class="statusPill" id="syncStatus">Connecting</span>
          <span class="rolePill">Player</span>
        </div>
        <div class="nowPlayingVisual">
          <div class="nowPlayingBars" aria-hidden="true">
            <span></span><span></span><span></span><span></span>
            <span></span><span></span><span></span><span></span>
          </div>
        </div>
        <div class="nowPlayingInfo">
          <p class="label">Assigned Track</p>
          <h2 id="currentTitle">Loading</h2>
        </div>
      </section>

      <section class="timeline compactTimeline">
        <span id="elapsed">0:00</span>
        <input id="seek" type="range" min="0" max="1000" value="0" />
        <span id="duration">0:00</span>
      </section>

      <section class="transport" id="controllerOnly">
        <button class="mainButton" id="playPause" type="button" aria-label="Play or pause">
          <span id="playIcon">Play</span>
        </button>
      </section>

      <section class="playerArm" id="playerOnly">
        <button class="armButton" id="armButton" type="button">Enable Player</button>
        <p id="playerHint">Tap enable once so the browser can start synchronized playback.</p>
      </section>

      <section class="volumePanel playerVolume">
        <label for="volume">Output</label>
        <input id="volume" type="range" min="0" max="200" value="85" />
        <span id="volumeValue">85%</span>
      </section>

      <div class="secondaryActions">
        <button class="ghostButton" id="stopButton" type="button">Stop</button>
      </div>

      <section class="devicePanel" id="devicePanel">
        <div class="sectionHeader">
          <div>
            <p class="label">Live Devices</p>
            <h2>Network Status</h2>
          </div>
          <div class="statusPill subtle" id="leadStatus">-- ms</div>
        </div>
        <div class="devices" id="deviceList"></div>
      </section>

      <section class="tracks" id="trackList" aria-label="Track library"></section>
    </main>

    <audio id="audio" preload="auto" playsinline></audio>
    <script src="/app.js"></script>
  </body>
</html>
