<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>CloudFader Control</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body data-mode="controller">
    <main class="shell">
      <header class="topbar">
        <div class="brandBlock">
          <p class="eyebrow">Control Room</p>
          <h1>CloudFader</h1>
        </div>
        <div class="topActions">
          <button class="devicePill" id="deviceToggle" type="button">
            <span class="dot"></span>
            <span id="deviceSummary">0/0 players</span>
          </button>
          <a class="modeLink" href="/player.html">Player</a>
        </div>
      </header>

      <section class="stagePanel">
        <div class="stageMeta">
          <span class="statusPill" id="syncStatus">Connecting</span>
          <span class="rolePill">Controller</span>
        </div>
        <div class="nowPlayingVisual">
          <div class="nowPlayingBars" aria-hidden="true">
            <span></span><span></span><span></span><span></span>
            <span></span><span></span><span></span><span></span>
          </div>
        </div>
        <div class="nowPlayingInfo">
          <p class="label">Now Playing</p>
          <h2 id="currentTitle">Loading</h2>
        </div>
      </section>

      <section class="transportPanel" id="controllerOnly">
        <div class="timeline">
          <span id="elapsed">0:00</span>
          <input id="seek" type="range" min="0" max="1000" value="0" />
          <span id="duration">0:00</span>
        </div>
        <div class="controlRow">
          <button class="ghostButton danger" id="stopButton" type="button">Stop</button>
          <button class="mainButton" id="playPause" type="button" aria-label="Play or pause">
            <span id="playIcon">Play</span>
          </button>
          <div class="volumePanel">
            <label for="volume">Volume</label>
            <input id="volume" type="range" min="0" max="200" value="85" />
            <span id="volumeValue">85%</span>
          </div>
        </div>
      </section>

      <section class="playerArm" id="playerOnly">
        <button class="armButton" id="armButton" type="button">Enable Player</button>
        <p id="playerHint">Player mode waits for controller commands after it is enabled.</p>
      </section>

      <section class="devicePanel" id="devicePanel">
        <div class="sectionHeader">
          <div>
            <p class="label">Live Devices</p>
            <h2>Playback Nodes</h2>
          </div>
          <div class="statusPill subtle" id="leadStatus">-- ms</div>
        </div>
        <div class="devices" id="deviceList"></div>
      </section>

      <section class="libraryPanel">
        <div class="sectionHeader">
          <div>
            <p class="label">Library</p>
            <h2>Tracks</h2>
          </div>
        </div>
        <div class="tracks" id="trackList" aria-label="Track library"></div>
      </section>
    </main>

    <audio id="audio" preload="auto" playsinline></audio>
    <script src="/app.js"></script>
  </body>
</html>
