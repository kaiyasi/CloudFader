<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>播音控制台</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body data-mode="controller">
    <main class="shell">
      <header class="topbar">
        <div class="brandBlock">
          <p class="eyebrow">Control Room</p>
          <h1>現場活動播音</h1>
        </div>
        <div class="topActions">
          <button class="devicePill" id="deviceToggle" type="button">
            <span class="dot"></span>
            <span id="deviceSummary">裝置</span>
          </button>
          <a class="modeLink" href="/player.html">播放端</a>
        </div>
      </header>

      <section class="stagePanel">
        <div class="stageMeta">
          <span class="statusPill" id="syncStatus">連線中</span>
          <span class="rolePill">主控端</span>
        </div>
        <div class="nowPlayingVisual">
          <div class="nowPlayingBars" aria-hidden="true">
            <span></span><span></span><span></span><span></span>
            <span></span><span></span><span></span><span></span>
          </div>
        </div>
        <div class="nowPlayingInfo">
          <p class="label">目前曲目</p>
          <h2 id="currentTitle">載入中</h2>
        </div>
      </section>

      <section class="transportPanel" id="controllerOnly">
        <div class="timeline">
          <span id="elapsed">0:00</span>
          <input id="seek" type="range" min="0" max="1000" value="0" />
          <span id="duration">0:00</span>
        </div>
        <div class="controlRow">
          <button class="ghostButton danger" id="stopButton" type="button">停止</button>
          <button class="mainButton" id="playPause" type="button" aria-label="播放或暫停">
            <span id="playIcon">▶</span>
          </button>
          <div class="volumePanel">
            <label for="volume">音量</label>
            <input id="volume" type="range" min="0" max="200" value="85" />
            <span id="volumeValue">85%</span>
          </div>
        </div>
      </section>

      <section class="playerArm" id="playerOnly">
        <button class="armButton" id="armButton" type="button">啟用此裝置播放</button>
        <p id="playerHint">瀏覽器需要先點一下，之後就能接收控制台同步播放。</p>
      </section>

      <section class="devicePanel" id="devicePanel">
        <div class="sectionHeader">
          <div>
            <p class="label">同步裝置</p>
            <h2>播放端狀態</h2>
          </div>
          <div class="statusPill subtle" id="leadStatus">-- ms</div>
        </div>
        <div class="devices" id="deviceList"></div>
      </section>

      <section class="libraryPanel">
        <div class="sectionHeader">
          <div>
            <p class="label">播放清單</p>
            <h2>曲目</h2>
          </div>
        </div>
        <div class="tracks" id="trackList" aria-label="播放清單"></div>
      </section>
    </main>

    <audio id="audio" preload="auto" playsinline></audio>
    <script src="/app.js"></script>
  </body>
</html>
