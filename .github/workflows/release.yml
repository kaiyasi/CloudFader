name: Build & Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Build exe
        run: npm run build

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: CloudFader.exe
          body: |
            ## CloudFader ${{ github.ref_name }}

            Developed by **Serelix Studio**

            ---

            ### How to use / 使用方式

            1. Download `CloudFader.exe` below
            2. Create an `audio/` folder next to the exe and place your music files inside (`.mp3` / `.m4a` / `.wav` / `.ogg`)
            3. Double-click `CloudFader.exe`
            4. The terminal shows a public Cloudflare URL — open it on any device to control playback

            > First launch auto-downloads `cloudflared.exe` (internet required).

            ---

            For questions or issues: **zengcode0315@gmail.com**
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
