name: Build Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag, for example v1.0.0"
        required: true
        type: string

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm install

      - name: Build executable
        run: npm run build

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          name: CloudFader ${{ github.event.inputs.tag || github.ref_name }}
          files: CloudFader.exe
          fail_on_unmatched_files: true
          generate_release_notes: true
          body: |
            ## CloudFader ${{ github.event.inputs.tag || github.ref_name }}

            Download `CloudFader.exe` below. This is the only end-user file required.

            ### Quick Start

            1. Create an `audio` folder next to `CloudFader.exe`.
            2. Put `.mp3`, `.m4a`, `.wav`, or `.ogg` files in that folder.
            3. Double-click `CloudFader.exe`.
            4. Open the displayed URL on phones, tablets, or player devices.

            On first launch, CloudFader downloads `cloudflared.exe` automatically for public tunnel support.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
